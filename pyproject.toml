[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockerfile-generator"
version = "0.1.0"
description = "Generate Dockerfiles for any programming language using a local LLM via Ollama."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ollama>=0.6.2,<0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dockerfile-gen = "dockerfile_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dockerfile_generator"]
